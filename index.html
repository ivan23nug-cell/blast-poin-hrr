const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),name=s=>String(s||'').replace(/(?:MAIL|-WA)$/i,'').trim().replace(/\s+/g,' '),val=p=>Number(p||0)*2500,rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID'),fmt=d=>d?.toDate?d.toDate().toLocaleString('id-ID'):d||'-',root=()=>collection(db,'users',S.user.uid,'customers'),cRef=id=>doc(db,'users',S.user.uid,'customers',id),rRoot=t=>collection(db,'users',S.user.uid,t==='own'?'retentionOwn':'retentionOther'),rRef=(t,id)=>doc(db,'users',S.user.uid,t==='own'?'retentionOwn':'retentionOther',id),tplRoot=()=>collection(db,'users',S.user.uid,'retentionTemplates');
function wa(phone,msg){let p=String(phone||'').replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);if(!p.startsWith('62'))p='62'+p;return'https://wa.me/'+p+'?text='+encodeURIComponent(msg)}

function render(){if(!S.user){$('app').innerHTML=login();return}$('app').innerHTML=top()+`<main class="wrap">${page()}</main>`}

function page(){switch(S.page){case'customers':return customers();case'add':return addPage();case'blast':return blast();case'blastDetail':return blastDetail();case'queue':return queue();case'follow':return follow();case'followDetail':return followDetail();case'retention':return retentionHome();case'retList':return retList();case'retDetail':return retDetail();case'retQueue':return retQueue();default:return home()}}
function home(){return`<div class="card hero"><div class="logo">➤</div><div><h2>Selamat datang, ${esc(S.profile.senderName||S.profile.username)}</h2><div class="muted">Pilih fitur yang ingin digunakan.</div></div></div><div class="grid home"><button class="menu m1" onclick="go('customers')"><b>👥 Datacustomer</b><span>Semua customer Anda</span></button><button class="menu m2" onclick="go('add')"><b>＋ Customer</b><span>Add Data / Add Data Excel</span></button><button class="menu m3" onclick="go('blast')"><b>➤ Blast Poin</b><span>1 per 1 atau beberapa</span></button><button class="menu m4" onclick="go('follow')"><b>↻ Follow Up</b><span>Customer yang perlu diingatkan</span></button><button class="menu m5" onclick="go('retention')"><b>♥ Blast Retensi</b><span>2 database transaksi terpisah</span></button></div><div class="card"><div class="row"><div><h3>Profil Pengirim</h3><div class="muted">Nama pengirim otomatis dipakai di Blast Poin, Follow Up, dan Retensi.</div></div><button class="btn outline" onclick="profileModal()">Edit</button></div></div>`}
function back(p='home'){return`<button class="btn ghost" onclick="go('${p}')">← Kembali</button>`}
function customers(){return`${back()}<div class="card"><div class="row"><div><h2>Datacustomer</h2><div class="muted">${S.customers.length} customer</div></div><button class="btn primary" onclick="go('add')">＋ Tambah</button></div></div><div class="card"><input id="q" class="input" placeholder="Cari nama, member, atau no HP..." oninput="filterCust(this.value)"></div><div id="custList" class="list">${custItems(S.customers)}</div>`}
function custItems(rows){return rows.length?rows.map(c=>`<div class="item"><div class="row wraprow"><div><div class="name">${esc(name(c.name))}</div><div class="small">${esc(c.member||'-')} · ${esc(c.phone||'-')}</div></div><div class="row"><span class="badge blue">${Number(c.points||0)} poin</span><button class="btn outline" onclick="editCust('${c.id}')">Edit</button></div></div></div>`).join(''):'<div class="card muted">Belum ada customer.</div>'}
window.filterCust=q=>{q=q.toLowerCase();$('custList').innerHTML=custItems(S.customers.filter(c=>(c.name+' '+c.member+' '+c.phone).toLowerCase().includes(q)))};
function addPage(){let c=S.current||{};return`${back('customers')}<div class="card"><h2>${c.id?'Edit Customer':'Tambah Customer'}</h2><div class="two"><label>Member<input id="m" class="input" value="${esc(c.member||'')}"></label><label>Nama<input id="n" class="input" value="${esc(c.name||'')}"></label><label>No HP<input id="p" class="input" value="${esc(c.phone||'')}"></label><label>Poin<input id="pt" class="input" type="number" value="${Number(c.points||0)}"></label></div><div class="row" style="margin-top:12px"><button class="btn outline" onclick="go('customers')">Batal</button><button class="btn primary" onclick="saveCust()">Simpan</button></div></div><div class="card"><h3>Add Data Excel</h3><div class="muted">Kolom minimal: MEMBER, NAMA, NO HP, POIN.</div><input id="excel" type="file" accept=".xlsx,.xls,.csv" class="input" style="margin-top:9px"><button class="btn success" style="margin-top:9px" onclick="importCust()">Import Excel</button></div>`}
window.editCust=id=>{S.current=S.customers.find(c=>c.id===id);go('add')};window.saveCust=async()=>{const d={member:$('m').value.trim(),name:$('n').value.trim(),phone:$('p').value.replace(/\D/g,''),points:Number($('pt').value||0),updatedAt:serverTimestamp()};if(!d.name||!d.phone)return alert('Nama dan No HP wajib diisi.');if(S.current?.id)await updateDoc(cRef(S.current.id),d);else await addDoc(root(),{...d,status:'Belum Blast',blastCount:0,followUpDone:false,createdAt:serverTimestamp()});S.current=null;await load();go('customers')};

window.importCust=async()=>{let f=$('excel').files[0];if(!f)return alert('Pilih file Excel.');let X=await sheet(),w=X.read(await f.arrayBuffer(),{type:'array'}),rows=X.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''}),ok=0;for(let r of rows){let k=Object.keys(r),pick=a=>{let z=k.find(x=>a.includes(String(x).trim().toUpperCase()));return z?r[z]:''};let d={member:String(pick(['MEMBER'])).trim(),name:String(pick(['NAMA','NAMA ASLI'])).trim(),phone:String(pick(['NO HP','NO WHATSAPP','NO. WHATSAPP'])).replace(/\D/g,''),points:Number(pick(['POIN'])||0),status:'Belum Blast',blastCount:0,followUpDone:false,createdAt:serverTimestamp()};if(d.name&&d.phone){await addDoc(root(),d);ok++}}await load();alert('Import selesai: '+ok+' customer.');go('customers')};
function blast(){let total=S.customers.length,bel=S.customers.filter(c=>c.status!=='Sudah Blast').length,done=S.customers.filter(c=>c.status==='Sudah Blast').length,pend=S.customers.filter(c=>c.status==='Pending').length;return`${back()}<div class="card hero"><div class="logo">➤</div><div><h2>Blast Poin</h2><div class="muted">Pilih satu customer atau beberapa customer.</div></div></div><div class="grid stats"><div class="stat s1">Total Customer<b>${total}</b></div><div class="stat s2">Belum Blast<b>${bel}</b></div><div class="stat s3">Sudah Blast<b>${done}</b></div><div class="stat s4">Pending<b>${pend}</b></div></div><div class="card"><div class="tabs"><button class="tab ${S.mode==='single'?'on':''}" onclick="setMode('single')">Kirim 1 per 1</button><button class="tab ${S.mode==='multi'?'on':''}" onclick="setMode('multi')">Kirim Beberapa</button></div></div><div class="card"><input id="bq" class="input" placeholder="Cari customer..." oninput="filterBlast(this.value)"></div><div id="blastList" class="list">${blastItems(S.customers)}</div>`}
function blastItems(rows){return rows.length?rows.map(c=>`<div class="item"><div class="row wraprow"><div class="row"><input class="check" type="${S.mode==='multi'?'checkbox':'radio'}" name="pick" ${S.picked.has(c.id)?'checked':''} onchange="pick('${c.id}',this.checked)"><div><div class="name">${esc(name(c.name))}</div><div class="small">${esc(c.phone||'-')} · ${Number(c.points||0)} poin</div></div></div><div class="row"><span class="badge ${c.status==='Sudah Blast'?'green':c.status==='Pending'?'orange':'red'}">${esc(c.status||'Belum Blast')}</span><button class="btn primary" onclick="openBlast('${c.id}')">${S.mode==='multi'?'Pilih':'Blast'}</button></div></div></div>`).join(''):'<div class="card muted">Tidak ada customer.</div>'}
window.setMode=m=>{S.mode=m;S.picked=new Set();render()};window.filterBlast=q=>{q=q.toLowerCase();$('blastList').innerHTML=blastItems(S.customers.filter(c=>(c.name+' '+c.member+' '+c.phone).toLowerCase().includes(q)))};window.pick=(id,on)=>{if(S.mode==='single'){openBlast(id);return}on?S.picked.add(id):S.picked.delete(id);filterBlast($('bq')?.value||'');if(S.picked.size)document.getElementById('blastList').insertAdjacentHTML('afterend',`<div class="card" id="pickbar"><div class="row"><b>${S.picked.size} customer terpilih</b><button class="btn success" onclick="startQueue()">Kirim ${S.picked.size} Customer</button></div></div>`)};

function blastDetail(){let c=S.current;return`${back('blast')}<div class="card"><div class="row wraprow"><div><h2>${esc(name(c.name))}</h2><div class="muted">${esc(c.member||'-')} · ${esc(c.phone||'-')}</div></div><span class="badge blue">${Number(c.points||0)} poin = ${rp(val(c.points))}</span></div></div><div class="card"><div class="row"><div><h3>Pilihan Layanan</h3><div class="muted">Pilih Otomatis tetap tersedia; pilihan manual dapat ditambah/dihapus.</div></div><div class="row"><button class="btn ghost" onclick="S.services=auto(S.current);render()">Pilih Otomatis</button><button class="btn outline" onclick="S.services=[];render()">Hapus</button></div></div><div class="services" style="margin-top:10px">${serviceHTML()}</div></div><div class="card"><h3>Preview Pesan</h3><div class="preview">${esc(message(c))}</div><div class="row" style="margin-top:10px"><button class="btn outline" onclick="navigator.clipboard.writeText(message(S.current));alert('Pesan disalin.')">Salin Pesan</button><button class="btn success" onclick="window.open(wa(S.current.phone,message(S.current)),'_blank')">Buka WhatsApp</button><button class="btn primary" onclick="markBlast('${c.id}')">Tandai Terkirim</button></div></div>`}

function queue(){let c=S.customers.find(x=>x.id===S.queue[S.qi]);if(!c)return`<div class="card">Antrean selesai.</div>`;return`${back('blast')}<div class="card"><div class="row"><h2>Kirim Beberapa</h2><span class="badge blue">${S.qi+1} dari ${S.queue.length}</span></div><div class="progress"><div style="width:${S.qi/S.queue.length*100}%"></div></div></div><div class="card"><h2>${esc(name(c.name))}</h2><div class="muted">${esc(c.phone||'-')} · ${Number(c.points||0)} poin</div></div><div class="card"><div class="row"><h3>Layanan</h3><div><button class="btn ghost" onclick="S.services=auto(S.customers.find(x=>x.id===S.queue[S.qi]));render()">Pilih Otomatis</button><button class="btn outline" onclick="S.services=[];render()">Hapus</button></div></div><div class="services" style="margin-top:9px">${serviceHTML()}</div></div><div class="card"><h3>Pesan Personal</h3><div class="preview">${esc(message(c))}</div><div class="row" style="margin-top:10px"><button class="btn success" onclick="window.open(wa('${esc(c.phone)}',message(S.customers.find(x=>x.id===S.queue[S.qi]))),'_blank')">Buka WhatsApp</button><button class="btn primary" onclick="queueSent()">Tandai Terkirim</button></div><button class="btn outline" style="margin-top:8px;width:100%" onclick="queueSkip()">Lewati Customer</button></div>`}
window.queueSent=async()=>{let id=S.queue[S.qi],c=S.customers.find(x=>x.id===id);await updateDoc(cRef(id),{status:'Sudah Blast',blastCount:Number(c.blastCount||0)+1,lastBlastAt:serverTimestamp(),lastBlastMessage:message(c),followUpDone:false});S.qi++;S.services=[];await load();if(S.qi>=S.queue.length){alert('Antrean selesai.');go('blast')}else render()};window.queueSkip=()=>{S.qi++;S.services=[];if(S.qi>=S.queue.length)go('blast');else render()};
function follow(){let need=S.customers.filter(c=>c.status==='Sudah Blast'&&!c.followUpDone),done=S.customers.filter(c=>c.followUpDone);let rows=S.followTab==='done'?done:need;return`${back()}<div class="card"><h2>Follow Up</h2><div class="tabs" style="margin-top:10px"><button class="tab ${S.followTab==='need'?'on':''}" onclick="S.followTab='need';render()">Perlu Follow Up (${need.length})</button><button class="tab ${S.followTab==='done'?'on':''}" onclick="S.followTab='done';render()">Sudah Selesai (${done.length})</button></div></div><div class="list">${rows.length?rows.map(c=>`<div class="item"><div class="row wraprow"><div><div class="name">${esc(name(c.name))}</div><div class="small">Blast ${Number(c.blastCount||0)}x · ${esc(fmt(c.lastBlastAt))}</div></div><button class="btn primary" onclick="openFollow('${c.id}')">Follow Up</button></div></div>`).join(''):'<div class="card muted">Tidak ada data.</div>'}</div>`}
window.openFollow=id=>{S.current=S.customers.find(c=>c.id===id);S.page='followDetail';render()};function followDetail(){let c=S.current;return`${back('follow')}<div class="card"><h2>${esc(name(c.name))}</h2><div class="muted">${esc(c.phone||'-')} · Blast ${Number(c.blastCount||0)}x</div></div><div class="card"><h3>Pesan Follow Up</h3><div class="preview">${esc(followMsg(c))}</div><div class="row" style="margin-top:10px"><button class="btn outline" onclick="navigator.clipboard.writeText(followMsg(S.current));alert('Pesan disalin.')">Salin</button><button class="btn success" onclick="window.open(wa(S.current.phone,followMsg(S.current)),'_blank')">Buka WhatsApp</button><button class="btn primary" onclick="finishFollow()">Tandai Selesai</button></div></div>`};window.finishFollow=async()=>{await updateDoc(cRef(S.current.id),{followUpDone:true,followUpAt:serverTimestamp()});await load();go('follow')};
function retentionHome(){return`${back()}<div class="card hero"><div class="logo">♥</div><div><h2>Blast Retensi</h2><div class="muted">Database dibuat terpisah sesuai kategori transaksi.</div></div></div><div class="two"><button class="card" style="text-align:left" onclick="openRet('own')"><h2>👤 Customer Retensi</h2><h3>(Transaksi dengan Saya)</h3><div class="muted">Customer yang pernah bertransaksi dengan Anda.</div></button><button class="card" style="text-align:left" onclick="openRet('other')"><h2>👥 Customer Retensi</h2><h3>(Transaksi Bukan Saya)</h3><div class="muted">Customer yang bertransaksi tetapi bukan customer pribadi Anda.</div></button></div><div class="card"><div class="row"><div><h3>Template Pesan Retensi</h3><div class="muted">Bisa diedit dan ditambah.</div></div><button class="btn outline" onclick="tplModal()">Kelola</button></div></div>`}
window.openRet=async t=>{S.retType=t;await loadRet();S.page='retList';render()};async function loadRet(){let s=await getDocs(rRoot(S.retType));S.retRows=s.docs.map(d=>({id:d.id,...d.data()}))};function retList(){let title=S.retType==='own'?'Transaksi dengan Saya':'Transaksi Bukan Saya';return`${back('retention')}<div class="card"><div class="row wraprow"><div><h2>Customer Retensi</h2><div class="muted">${title} · ${S.retRows.length} customer</div></div><div class="row"><button class="btn primary" onclick="retAddModal()">＋ Tambah</button><button class="btn outline" onclick="retImportModal()">Import Excel</button></div></div><div class="tabs" style="margin-top:11px"><button class="tab ${S.retMode==='single'?'on':''}" onclick="setRetMode('single')">Kirim 1 per 1</button><button class="tab ${S.retMode==='multi'?'on':''}" onclick="setRetMode('multi')">Kirim Beberapa</button></div></div><div class="card"><input id="rq" class="input" placeholder="Cari nama/member/no HP..." oninput="filterRet(this.value)"></div><div id="retList" class="list">${retItems(S.retRows)}</div>${S.retMode==='multi'&&S.retPicked.size?`<div class="card"><div class="row"><b>${S.retPicked.size} customer terpilih</b><button class="btn success" onclick="startRetQueue()">Kirim ${S.retPicked.size} Customer</button></div></div>`:''}`};function retItems(rows){return rows.length?rows.map(r=>`<div class="item"><div class="row wraprow"><div class="row">${S.retMode==='multi'?`<input class="check" type="checkbox" ${S.retPicked.has(r.id)?'checked':''} onchange="retPick('${r.id}',this.checked)">`:''}<div><div class="name">${esc(name(r.name))}</div><div class="small">${esc(r.member||'-')} · ${esc(r.phone||'-')}</div><div class="small">Transaksi ${Number(r.transactionCount||0)}x · Terakhir ${esc(r.lastTransaction||'-')}</div></div></div><div class="row"><span class="badge ${r.status==='Sudah Blast'?'green':r.status==='Pending'?'orange':'red'}">${esc(r.status||'Belum Blast')}</span><button class="btn primary" onclick="${S.retMode==='multi'?`retPick('${r.id}',true)`:`openRetDetail('${r.id}')`}">${S.retMode==='multi'?'Pilih':'Pilih'}</button></div></div></div>`).join(''):'<div class="card muted">Belum ada data retensi.</div>'};window.setRetMode=m=>{S.retMode=m;S.retPicked=new Set();render()};window.retPick=(id,on)=>{on?S.retPicked.add(id):S.retPicked.delete(id);render()};window.filterRet=q=>{q=q.toLowerCase();$('retList').innerHTML=retItems(S.retRows.filter(r=>(r.name+' '+r.member+' '+r.phone).toLowerCase().includes(q)))};window.openRetDetail=id=>{S.retCurrent=S.retRows.find(r=>r.id===id);S.page='retDetail';render()};window.startRetQueue=()=>{S.retQueue=[...S.retPicked];S.retQi=0;S.templateId=S.templates[0]?.id||null;S.page='retQueue';render()};
function retDetail(){let r=S.retCurrent,t=S.templates.find(x=>x.id===S.templateId)||S.templates[0];let msg=(t?.body||'').replaceAll('{{NAMA}}',name(r.name)).replaceAll('{{NAMA_PENGIRIM}}',S.profile.senderName||'Ivan').replaceAll('{{TRANSAKSI}}',String(r.transactionCount||0)).replaceAll('{{TERAKHIR_TRANSAKSI}}',r.lastTransaction||'-');return`${back('retList')}<div class="card"><div class="row wraprow"><div><h2>${esc(name(r.name))}</h2><div class="muted">${esc(r.member||'-')} · ${esc(r.phone||'-')}</div></div><div class="row"><span class="badge blue">${Number(r.transactionCount||0)}x transaksi</span><span class="badge purple">${esc(r.lastTransaction||'-')}</span></div></div></div><div class="two"><div class="card"><h3>Riwayat Transaksi</h3>${(r.transactions||[]).map(t=>`<div class="item" style="margin-top:8px"><div class="row"><span>${esc(t.date||'-')}</span><b>${rp(t.amount)}</b></div></div>`).join('')||'<div class="muted">Belum ada riwayat.</div>'}</div><div class="card"><h3>Pilih Template Pesan</h3><select class="select" onchange="S.templateId=this.value;render()">${S.templates.map(x=>`<option value="${x.id}" ${x.id===t?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="preview" style="margin-top:9px">${esc(msg)}</div><div class="row" style="margin-top:10px"><button class="btn outline" onclick="navigator.clipboard.writeText(${JSON.stringify(msg)});alert('Pesan disalin.')">Salin</button><button class="btn success" onclick="retSend()">Buka WhatsApp</button><button class="btn primary" onclick="retSent()">Tandai Terkirim</button></div></div></div>`}
function retMsg(r){let t=S.templates.find(x=>x.id===S.templateId)||S.templates[0];return(t?.body||'').replaceAll('{{NAMA}}',name(r.name)).replaceAll('{{NAMA_PENGIRIM}}',S.profile.senderName||'Ivan').replaceAll('{{TRANSAKSI}}',String(r.transactionCount||0)).replaceAll('{{TERAKHIR_TRANSAKSI}}',r.lastTransaction||'-')}
function retQueue(){let r=S.retRows.find(x=>x.id===S.retQueue[S.retQi]);if(!r)return`<div class="card">Antrean retensi selesai.</div>`;let t=S.templates.find(x=>x.id===S.templateId)||S.templates[0];return`${back('retList')}<div class="card"><div class="row"><h2>Kirim Beberapa - Retensi</h2><span class="badge blue">${S.retQi+1} dari ${S.retQueue.length}</span></div><div class="progress"><div style="width:${S.retQi/S.retQueue.length*100}%"></div></div></div><div class="card"><h2>${esc(name(r.name))}</h2><div class="muted">${esc(r.phone||'-')} · ${Number(r.transactionCount||0)}x transaksi</div></div><div class="card"><h3>Template Pesan</h3><select class="select" onchange="S.templateId=this.value;render()">${S.templates.map(x=>`<option value="${x.id}" ${x.id===t?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="preview" style="margin-top:9px">${esc(retMsg(r))}</div><div class="row" style="margin-top:10px"><button class="btn success" onclick="window.open(wa('${esc(r.phone)}',retMsg(S.retRows.find(x=>x.id===S.retQueue[S.retQi]))),'_blank')">Buka WhatsApp</button><button class="btn primary" onclick="retQueueSent()">Tandai Terkirim</button></div><button class="btn outline" style="margin-top:8px;width:100%" onclick="retQueueSkip()">Lewati Customer</button></div>`}
window.retQueueSent=async()=>{let id=S.retQueue[S.retQi];await updateDoc(rRef(S.retType,id),{status:'Sudah Blast',lastBlastAt:serverTimestamp(),lastTemplateId:S.templateId||null});S.retQi++;await loadRet();if(S.retQi>=S.retQueue.length){alert('Antrean retensi selesai.');go('retList')}else render()};window.retQueueSkip=()=>{S.retQi++;if(S.retQi>=S.retQueue.length)go('retList');else render()};
window.retSend=()=>{let r=S.retCurrent,t=S.templates.find(x=>x.id===S.templateId)||S.templates[0],msg=(t?.body||'').replaceAll('{{NAMA}}',name(r.name)).replaceAll('{{NAMA_PENGIRIM}}',S.profile.senderName||'Ivan').replaceAll('{{TRANSAKSI}}',String(r.transactionCount||0)).replaceAll('{{TERAKHIR_TRANSAKSI}}',r.lastTransaction||'-');window.open(wa(r.phone,msg),'_blank')};window.retSent=async()=>{await updateDoc(rRef(S.retType,S.retCurrent.id),{status:'Sudah Blast',lastBlastAt:serverTimestamp(),lastTemplateId:S.templateId||null});await loadRet();go('retList')};
window.retAddModal=()=>modal(`<h2>Tambah Customer Retensi</h2><div class="two"><label>Member<input id="rm" class="input"></label><label>Nama<input id="rn" class="input"></label><label>No HP<input id="rp" class="input"></label><label>Tanggal Transaksi<input id="rd" class="input" placeholder="19/09/2026"></label><label>Nilai Transaksi<input id="ra" class="input" type="number"></label></div><div class="row" style="margin-top:12px"><button class="btn outline" onclick="closeModal()">Batal</button><button class="btn primary" onclick="saveRet()">Simpan</button></div>`);
window.saveRet=async()=>{let n=$('rn').value.trim(),p=$('rp').value.replace(/\D/g,'');if(!n||!p)return alert('Nama dan No HP wajib.');let t={date:$('rd').value.trim(),amount:Number($('ra').value||0)};await addDoc(rRoot(S.retType),{member:$('rm').value.trim(),name:n,phone:p,transactions:[t],transactionCount:1,lastTransaction:t.date||'-',status:'Belum Blast',createdAt:serverTimestamp()});closeModal();await loadRet();render()};
window.retImportModal=()=>modal(`<h2>Import Excel Retensi</h2><div class="muted">Kolom: MEMBER, NAMA, NO HP, TANGGAL TRANSAKSI/TANGGAL, NILAI TRANSAKSI/NILAI.</div><input id="re" class="input" type="file" accept=".xlsx,.xls,.csv" style="margin-top:9px"><div class="row" style="margin-top:12px"><button class="btn outline" onclick="closeModal()">Batal</button><button class="btn primary" onclick="importRet()">Import</button></div>`);
window.importRet=async()=>{let f=$('re').files[0];if(!f)return;let X=await sheet(),w=X.read(await f.arrayBuffer(),{type:'array'}),rows=X.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''}),ok=0;for(let r of rows){let k=Object.keys(r),pick=a=>{let z=k.find(x=>a.includes(String(x).trim().toUpperCase()));return z?r[z]:''},n=String(pick(['NAMA','NAMA CUSTOMER'])).trim(),p=String(pick(['NO HP','NO WHATSAPP'])).replace(/\D/g,'');if(!n||!p)continue;let t={date:String(pick(['TANGGAL TRANSAKSI','TANGGAL'])).trim(),amount:Number(pick(['NILAI TRANSAKSI','NILAI','AMOUNT'])||0)};await addDoc(rRoot(S.retType),{member:String(pick(['MEMBER'])).trim(),name:n,phone:p,transactions:[t],transactionCount:1,lastTransaction:t.date||'-',status:'Belum Blast',createdAt:serverTimestamp()});ok++}closeModal();await loadRet();render();alert('Import selesai: '+ok+' customer.')};
function tplModal(){modal(`<div class="row"><h2>Template Retensi</h2><button class="btn outline" onclick="closeModal()">Tutup</button></div><div class="list" style="margin-top:9px">${S.templates.map(t=>`<div class="item"><div class="row"><div><b>${esc(t.name)}</b><div class="small">${esc(t.body)}</div></div><button class="btn danger" onclick="delTpl('${t.id}')">Hapus</button></div></div>`).join('')}</div><hr><input id="tn" class="input" placeholder="Nama template"><textarea id="tb" class="ta" style="margin-top:8px" placeholder="Isi pesan. Placeholder: {{NAMA}}, {{NAMA_PENGIRIM}}, {{TRANSAKSI}}, {{TERAKHIR_TRANSAKSI}}"></textarea><button class="btn primary" style="margin-top:8px" onclick="saveTpl()">Simpan Template</button>`)}
window.saveTpl=async()=>{let n=$('tn').value.trim(),b=$('tb').value.trim();if(!n||!b)return;await addDoc(tplRoot(),{name:n,body:b,createdAt:serverTimestamp()});await templates();tplModal()};window.delTpl=async id=>{if(confirm('Hapus template?')){await deleteDoc(doc(db,'users',S.user.uid,'retentionTemplates',id));await templates();tplModal()}};
function profileModal(){modal(`<h2>Profil Saya</h2><div class="two"><label>Username<input class="input" value="${esc(S.profile.username||'')}" disabled></label><label>Nama Pengirim<input id="sn" class="input" value="${esc(S.profile.senderName||'')}"></label></div><div class="muted" style="margin-top:8px">Nama ini dipakai otomatis di semua pesan.</div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveProfile()">Simpan</button><button class="btn danger" onclick="logout()">Keluar</button></div>`)}
window.saveProfile=async()=>{let n=$('sn').value.trim();await updateDoc(doc(db,'users',S.user.uid),{senderName:n});await updateProfile(S.user,{displayName:n});S.profile.senderName=n;closeModal();render()};window.logout=()=>signOut(auth);
function modal(x){$('modal').innerHTML=`<div class="modal"><div class="modalbox">${x}</div></div>`}window.closeModal=()=>{$('modal').innerHTML=''};
function login(){return`<div class="login"><div class="loginbox"><div class="logo" style="margin:auto auto 12px">➤</div><h1 class="center">Blast Poin HRR</h1><p class="muted center">Masuk dengan Username dan NIP.</p><div id="err"></div><label>Username<input id="lu" class="input" autocomplete="username"></label><label style="display:block;margin-top:9px">NIP<input id="lp" class="input" type="password" inputmode="numeric" autocomplete="current-password"></label><button class="btn primary" style="width:100%;margin-top:12px" onclick="loginNow()">Masuk</button></div></div>`}
window.loginNow=async()=>{let u=$('lu').value.trim().toLowerCase(),p=$('lp').value.trim();if(!u||!p)return;try{await signInWithEmailAndPassword(auth,u+'@blastpoinhrr.app',p)}catch(e){$('err').innerHTML='<div class="badge red" style="margin-top:9px">Username atau NIP tidak sesuai.</div>'}};
window.go=async p=>{S.page=p;S.current=null;if(p==='customers'||p==='blast'||p==='follow')await load();render()};
onAuthStateChanged(auth,async u=>{if(u){S.user=u;await profile();await load();await templates();render()}else{S.user=null;render()}});
</script></body></html>
